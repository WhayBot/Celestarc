<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Celestarc Industries</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-main: #ffffff;
        --text-main: #1f1f1f;
        --text-muted: #4a4a4a;
        --border-line: #e2e2e2;
        --accent: #c2410c;
        --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'IBM Plex Mono', monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-sans);
        background-color: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        border-bottom: 1px solid var(--border-line);
        height: 76px;
        display: flex;
        align-items: center;
        padding: 0 2rem;
      }
      .brand-logo {
        height: 52px;
        width: auto;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem;
      }
      .center-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      h1 {
        font-family: var(--font-mono);
        font-size: 110px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--text-main);
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 24px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 2.25rem;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: var(--accent);
        color: #ffffff;
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        border-radius: 3px;
        transition: opacity 150ms ease;
      }
      .btn-primary:hover {
        opacity: 0.9;
      }
      footer {
        border-top: 1px solid var(--border-line);
        padding: 1.5rem 2rem;
        font-size: 14px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Celestarc Industries Home">
        <img src="/image/logo.webp" alt="Celestarc Industries" class="brand-logo" onerror="this.src='/image/logo.png'" />
      </a>
    </header>

    <main>
      <div class="center-block">
        <h1>404</h1>
        <p>Page Not Found</p>
        <a href="/" class="btn-primary">&larr; Return to Home</a>
      </div>
    </main>

    <footer>
      &copy; Celestarc Industries. All rights reserved.
    </footer>
  </body>
</html>
